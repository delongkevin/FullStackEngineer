<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450' width='800' height='450'>
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005ec5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f2f2f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Phone frame -->
  <rect x="270" y="18" width="260" height="414" rx="32" fill="#1c1c1e" filter="url(#shadow)"/>
  <rect x="278" y="25" width="244" height="400" rx="26" fill="url(#cardBg)"/>

  <!-- Status bar -->
  <rect x="278" y="25" width="244" height="40" rx="26" fill="white"/>
  <rect x="278" y="47" width="244" height="18" fill="white"/>
  <!-- Notch -->
  <rect x="355" y="27" width="90" height="20" rx="11" fill="#1c1c1e"/>

  <!-- App Header -->
  <rect x="278" y="65" width="244" height="40" fill="white"/>
  <!-- Heart-pulse icon -->
  <rect x="290" y="74" width="26" height="26" rx="7" fill="#0a84ff"/>
  <polyline points="293,86 297,86 300,82 303,89 306,78 309,86 312,86" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="322" y="90" font-family="SF Pro, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1c1e">MedIoT Connect</text>
  <!-- LIVE badge -->
  <rect x="462" y="76" width="36" height="18" rx="9" fill="#30d158"/>
  <text x="480" y="87" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">LIVE</text>

  <!-- Divider -->
  <line x1="278" y1="105" x2="522" y2="105" stroke="#e5e5ea" stroke-width="1"/>

  <!-- Vitals Section Label -->
  <text x="290" y="124" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366" letter-spacing="0.5">LIVE VITALS · ROOM 302</text>

  <!-- Vital Cards Grid (2x2) -->
  <!-- HR Card -->
  <rect x="286" y="130" width="112" height="63" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="296" y="146" font-family="sans-serif" font-size="16">❤️</text>
  <text x="296" y="158" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">HEART RATE</text>
  <text x="296" y="178" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1c1c1e">72</text>
  <text x="318" y="178" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="#636366">bpm</text>
  <text x="296" y="189" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366">→ Normal</text>

  <!-- SpO2 Card -->
  <rect x="404" y="130" width="112" height="63" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="414" y="146" font-family="sans-serif" font-size="16">🫧</text>
  <text x="414" y="158" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">SPO₂</text>
  <text x="414" y="178" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1c1c1e">97</text>
  <text x="434" y="178" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="#636366">%</text>
  <text x="414" y="189" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#30d158">↑ Good</text>

  <!-- Temp Card -->
  <rect x="286" y="200" width="112" height="63" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="296" y="216" font-family="sans-serif" font-size="16">🌡️</text>
  <text x="296" y="229" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">TEMPERATURE</text>
  <text x="296" y="248" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1c1c1e">98.4</text>
  <text x="296" y="259" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366">→ Normal °F</text>

  <!-- BP Card -->
  <rect x="404" y="200" width="112" height="63" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="414" y="216" font-family="sans-serif" font-size="16">💉</text>
  <text x="414" y="229" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">BLOOD PRESSURE</text>
  <text x="414" y="248" font-family="SF Pro, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1c1c1e">118/76</text>
  <text x="414" y="259" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#30d158">↑ Optimal</text>

  <!-- ECG Card -->
  <rect x="286" y="270" width="230" height="54" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="296" y="284" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366" letter-spacing="0.5">ECG TRACE (LIVE BLE FEED)</text>
  <!-- ECG waveform simulation -->
  <polyline points="292,310 305,310 310,310 313,293 316,320 320,306 325,310 340,310 343,293 346,320 350,306 355,310 370,310 373,293 376,320 380,306 385,310 400,310 403,293 406,320 410,306 415,310 430,310 433,293 436,320 440,306 445,310 510,310" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Nav -->
  <rect x="278" y="385" width="244" height="40" rx="0" fill="white"/>
  <rect x="278" y="385" width="244" height="2" fill="#e5e5ea"/>
  <rect x="278" y="411" width="244" height="14" rx="0" fill="white"/>
  <!-- Nav icons -->
  <rect x="290" y="389" width="44" height="20" rx="6" fill="#e8f1ff"/>
  <text x="312" y="403" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#0a84ff" text-anchor="middle" font-weight="600">Dashboard</text>
  <text x="363" y="403" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" text-anchor="middle">Devices</text>
  <text x="420" y="403" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" text-anchor="middle">Wearables</text>
  <text x="473" y="403" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" text-anchor="middle">API</text>

  <!-- Left side info panel -->
  <text x="40" y="63" font-family="SF Pro, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white">Medical IoT</text>
  <text x="40" y="86" font-family="SF Pro, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white">Device Monitor</text>
  <text x="40" y="115" font-family="SF Pro, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">Cross-platform mobile app demo</text>
  <text x="40" y="133" font-family="SF Pro, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">for DornerWorks application</text>

  <!-- Feature badges left -->
  <rect x="40" y="155" width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="85" y="170" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">iOS · Swift</text>

  <rect x="138" y="155" width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="183" y="170" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Android · Kotlin</text>

  <rect x="40" y="184" width="80" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="80" y="199" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Flutter</text>

  <rect x="128" y="184" width="110" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="183" y="199" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">React Native</text>

  <!-- Key highlights -->
  <text x="40" y="241" font-family="SF Pro, -apple-system, sans-serif" font-size="12" font-weight="700" fill="white">Key Highlights</text>
  <circle cx="50" cy="261" r="3" fill="#30d158"/>
  <text x="62" y="265" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">BLE 5.x / NFC connectivity</text>
  <circle cx="50" cy="281" r="3" fill="#30d158"/>
  <text x="62" y="284" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Real-time REST API integration</text>
  <circle cx="50" cy="301" r="3" fill="#30d158"/>
  <text x="62" y="304" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Apple Watch / Wear OS / Garmin</text>
  <circle cx="50" cy="320" r="3" fill="#30d158"/>
  <text x="62" y="324" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">HIPAA security + OAuth 2.0</text>
  <circle cx="50" cy="340" r="3" fill="#30d158"/>
  <text x="62" y="344" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Medical &amp; IoT device management</text>
  <circle cx="50" cy="360" r="3" fill="#30d158"/>
  <text x="62" y="364" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Cross-platform UI/UX design</text>

  <!-- Right side decorative elements -->
  <text x="560" y="72" font-family="SF Pro, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white">DornerWorks</text>
  <text x="560" y="90" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Senior Mobile Developer</text>
  <text x="560" y="106" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Application Demo</text>

  <!-- Wearable icons right side -->
  <rect x="560" y="131" width="200" height="54" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="151" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Wearable Support</text>
  <text x="590" y="173" font-family="sans-serif" font-size="20" text-anchor="middle">⌚</text>
  <text x="590" y="184" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Apple Watch</text>
  <text x="660" y="173" font-family="sans-serif" font-size="20" text-anchor="middle">📱</text>
  <text x="660" y="184" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Wear OS</text>
  <text x="730" y="173" font-family="sans-serif" font-size="20" text-anchor="middle">🏃</text>
  <text x="730" y="184" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Garmin</text>

  <!-- Tech stack right -->
  <rect x="560" y="203" width="200" height="117" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="221" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Tech Stack</text>
  <text x="578" y="239" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Swift / Xcode</text>
  <text x="578" y="256" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Kotlin / Android Studio</text>
  <text x="578" y="272" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Flutter / Dart</text>
  <text x="578" y="288" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">React Native / TypeScript</text>
  <text x="578" y="304" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">RESTful APIs / OAuth 2.0</text>
  <text x="578" y="320" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">BLE 5.x / NFC / MQTT</text>

  <!-- Bottom badge -->
  <rect x="560" y="342" width="200" height="63" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="364" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">5+ Years Experience</text>
  <text x="660" y="382" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">iOS &amp; Android Development</text>
  <text x="660" y="398" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Medical &amp; IoT Products</text>
</svg>
