<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450'>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2f4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f1e30;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#07101d"/>
  <rect x="8" y="8" width="784" height="434" rx="18" fill="url(#bgGrad)" stroke="#7dd3fc" stroke-width="3"/>
  <rect x="20" y="20" width="760" height="410" rx="14" fill="none" stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="20" width="760" height="50" rx="8" fill="#0d1b2a" stroke="#56c7ff" stroke-width="2"/>
  <text x="40" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#67e8f9">AI Testing Strategy Dashboard</text>
  <text x="40" y="58" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Automotive Software Validation • dSPACE • CANoe • Python • CAPL</text>

  <!-- Live indicator -->
  <circle cx="740" cy="43" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="715" y="47" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">LIVE</text>

  <!-- Main content grid -->
  <!-- Test Coverage Panel -->
  <rect x="20" y="85" width="370" height="165" rx="6" fill="url(#panelGrad)" stroke="#2d5f8d" stroke-width="1.5"/>
  <text x="30" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Test Coverage Analysis</text>

  <!-- Coverage bars -->
  <g>
    <text x="30" y="122" font-family="monospace" font-size="9" fill="#94a3b8">Camera Systems</text>
    <rect x="140" y="114" width="220" height="12" rx="3" fill="#1a2f4a"/>
    <rect x="140" y="114" width="187" height="12" rx="3" fill="#22c55e"/>
    <text x="365" y="122" font-family="monospace" font-size="9" fill="#22c55e">85%</text>

    <text x="30" y="142" font-family="monospace" font-size="9" fill="#94a3b8">ADAS Features</text>
    <rect x="140" y="134" width="220" height="12" rx="3" fill="#1a2f4a"/>
    <rect x="140" y="134" width="198" height="12" rx="3" fill="#22c55e"/>
    <text x="365" y="142" font-family="monospace" font-size="9" fill="#22c55e">90%</text>

    <text x="30" y="162" font-family="monospace" font-size="9" fill="#94a3b8">AI Models</text>
    <rect x="140" y="154" width="220" height="12" rx="3" fill="#1a2f4a"/>
    <rect x="140" y="154" width="165" height="12" rx="3" fill="#f59e0b"/>
    <text x="365" y="162" font-family="monospace" font-size="9" fill="#f59e0b">75%</text>

    <text x="30" y="182" font-family="monospace" font-size="9" fill="#94a3b8">Data Pipelines</text>
    <rect x="140" y="174" width="220" height="12" rx="3" fill="#1a2f4a"/>
    <rect x="140" y="174" width="203" height="12" rx="3" fill="#22c55e"/>
    <text x="365" y="182" font-family="monospace" font-size="9" fill="#22c55e">92%</text>

    <text x="30" y="202" font-family="monospace" font-size="9" fill="#94a3b8">CAN Networks</text>
    <rect x="140" y="194" width="220" height="12" rx="3" fill="#1a2f4a"/>
    <rect x="140" y="194" width="209" height="12" rx="3" fill="#22c55e"/>
    <text x="365" y="202" font-family="monospace" font-size="9" fill="#22c55e">95%</text>
  </g>

  <!-- Metrics cards -->
  <g>
    <text x="30" y="225" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Test Execution</text>
    <text x="30" y="242" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00b4d8">1,247</text>

    <text x="180" y="225" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Pass Rate</text>
    <text x="180" y="242" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22c55e">94.2%</text>
  </g>

  <!-- HIL Test Status Panel -->
  <rect x="410" y="85" width="370" height="165" rx="6" fill="url(#panelGrad)" stroke="#2d5f8d" stroke-width="1.5"/>
  <text x="420" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">HIL Test Execution Status</text>

  <!-- Status table -->
  <g>
    <text x="420" y="120" font-family="monospace" font-size="8" fill="#64748b">TEST CASE</text>
    <text x="570" y="120" font-family="monospace" font-size="8" fill="#64748b">STATUS</text>
    <text x="680" y="120" font-family="monospace" font-size="8" fill="#64748b">TIME</text>

    <text x="420" y="137" font-family="monospace" font-size="9" fill="#e2e8f0">TC_AEB_001</text>
    <rect x="570" y="128" width="45" height="14" rx="3" fill="#0d2b12" stroke="#22c55e" stroke-width="1"/>
    <text x="575" y="138" font-family="monospace" font-size="8" fill="#22c55e">PASS</text>
    <text x="680" y="137" font-family="monospace" font-size="9" fill="#94a3b8">1.2s</text>

    <text x="420" y="155" font-family="monospace" font-size="9" fill="#e2e8f0">TC_LKA_002</text>
    <rect x="570" y="146" width="45" height="14" rx="3" fill="#0d2b12" stroke="#22c55e" stroke-width="1"/>
    <text x="575" y="156" font-family="monospace" font-size="8" fill="#22c55e">PASS</text>
    <text x="680" y="155" font-family="monospace" font-size="9" fill="#94a3b8">0.8s</text>

    <text x="420" y="173" font-family="monospace" font-size="9" fill="#e2e8f0">TC_OBJ_003</text>
    <rect x="570" y="164" width="60" height="14" rx="3" fill="#2b1f0d" stroke="#f59e0b" stroke-width="1"/>
    <text x="575" y="174" font-family="monospace" font-size="8" fill="#f59e0b">RUNNING</text>
    <text x="680" y="173" font-family="monospace" font-size="9" fill="#94a3b8">-</text>

    <text x="420" y="191" font-family="monospace" font-size="9" fill="#e2e8f0">TC_CAM_004</text>
    <rect x="570" y="182" width="45" height="14" rx="3" fill="#1a2234" stroke="#6b7280" stroke-width="1"/>
    <text x="575" y="192" font-family="monospace" font-size="8" fill="#6b7280">QUEUE</text>
    <text x="680" y="191" font-family="monospace" font-size="9" fill="#94a3b8">-</text>

    <text x="420" y="209" font-family="monospace" font-size="9" fill="#e2e8f0">TC_CAN_005</text>
    <rect x="570" y="200" width="45" height="14" rx="3" fill="#1a2234" stroke="#6b7280" stroke-width="1"/>
    <text x="575" y="210" font-family="monospace" font-size="8" fill="#6b7280">QUEUE</text>
    <text x="680" y="209" font-family="monospace" font-size="9" fill="#94a3b8">-</text>
  </g>

  <!-- Tool stack -->
  <text x="420" y="230" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Active Tools</text>
  <rect x="420" y="234" width="70" height="18" rx="4" fill="#1a2f4a" stroke="#2d5f8d" stroke-width="1"/>
  <text x="428" y="246" font-family="Arial, sans-serif" font-size="9" fill="#00b4d8">dSPACE</text>
  <rect x="495" y="234" width="60" height="18" rx="4" fill="#1a2f4a" stroke="#2d5f8d" stroke-width="1"/>
  <text x="503" y="246" font-family="Arial, sans-serif" font-size="9" fill="#00b4d8">CANoe</text>
  <rect x="560" y="234" width="60" height="18" rx="4" fill="#1a2f4a" stroke="#2d5f8d" stroke-width="1"/>
  <text x="568" y="246" font-family="Arial, sans-serif" font-size="9" fill="#00b4d8">Python</text>

  <!-- AI Model Validation Panel -->
  <rect x="20" y="265" width="370" height="170" rx="6" fill="url(#panelGrad)" stroke="#2d5f8d" stroke-width="1.5"/>
  <text x="30" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">AI Model Validation</text>

  <!-- Model metrics -->
  <g>
    <text x="30" y="302" font-family="monospace" font-size="9" fill="#94a3b8">Object Detection</text>
    <text x="30" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">98.7% mAP</text>

    <text x="200" y="302" font-family="monospace" font-size="9" fill="#94a3b8">Lane Detection</text>
    <text x="200" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">96.3% IoU</text>

    <text x="30" y="342" font-family="monospace" font-size="9" fill="#94a3b8">Inference Time</text>
    <text x="30" y="356" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00b4d8">12.4ms</text>

    <text x="200" y="342" font-family="monospace" font-size="9" fill="#94a3b8">FPS</text>
    <text x="200" y="356" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00b4d8">80.6</text>
  </g>

  <!-- Test scenario graph -->
  <text x="30" y="380" font-family="monospace" font-size="9" fill="#94a3b8">Test Scenarios (Last 10)</text>
  <polyline points="30,425 70,400 110,408 150,390 190,402 230,385 270,395 310,380 350,390 370,375"
            fill="none" stroke="#00b4d8" stroke-width="2"/>
  <line x1="30" y1="428" x2="370" y2="428" stroke="#2d5f8d" stroke-width="1"/>
  <line x1="30" y1="375" x2="30" y2="428" stroke="#2d5f8d" stroke-width="1"/>

  <!-- Defect Tracking Panel -->
  <rect x="410" y="265" width="370" height="170" rx="6" fill="url(#panelGrad)" stroke="#2d5f8d" stroke-width="1.5"/>
  <text x="420" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Defect Tracking &amp; Analytics</text>

  <!-- Defect pie chart representation -->
  <circle cx="510" cy="345" r="50" fill="none" stroke="#1a2f4a" stroke-width="25"/>
  <circle cx="510" cy="345" r="50" fill="none" stroke="#22c55e" stroke-width="25"
          stroke-dasharray="250 314" transform="rotate(-90 510 345)"/>
  <circle cx="510" cy="345" r="50" fill="none" stroke="#f59e0b" stroke-width="25"
          stroke-dasharray="42 314" stroke-dashoffset="-250" transform="rotate(-90 510 345)"/>
  <circle cx="510" cy="345" r="50" fill="none" stroke="#ef4444" stroke-width="25"
          stroke-dasharray="22 314" stroke-dashoffset="-292" transform="rotate(-90 510 345)"/>

  <text x="510" y="348" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle">127</text>
  <text x="510" y="363" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Total Defects</text>

  <!-- Legend -->
  <g>
    <circle cx="605" cy="315" r="4" fill="#22c55e"/>
    <text x="615" y="318" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">Resolved (95)</text>

    <circle cx="605" cy="332" r="4" fill="#f59e0b"/>
    <text x="615" y="335" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">In Progress (19)</text>

    <circle cx="605" cy="349" r="4" fill="#ef4444"/>
    <text x="615" y="352" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">Critical (13)</text>
  </g>

  <!-- Metrics -->
  <g>
    <text x="420" y="400" font-family="monospace" font-size="9" fill="#94a3b8">Avg. Resolution Time</text>
    <text x="420" y="417" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#00b4d8">2.3 days</text>

    <text x="600" y="400" font-family="monospace" font-size="9" fill="#94a3b8">ISTQB Certified Team</text>
    <text x="600" y="417" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#22c55e">8/10</text>
  </g>
</svg>
