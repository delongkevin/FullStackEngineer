<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Insights App Demo</title>
  <style>
    :root {
      --sky: #0f4c81;
      --sky-2: #1f78bf;
      --panel: rgba(255,255,255,0.18);
      --text: #f8fbff;
      --muted: #d8e9f8;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--sky), var(--sky-2));
      min-height: 100vh;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }
    .row {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .row { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 10px; font-size: 20px; }
    .muted { color: var(--muted); }
    .temp { font-size: 52px; font-weight: 700; }
    .forecast {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pill {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      font-size: 13px;
    }
    .alert {
      margin-top: 12px;
      color: #1f2937;
      background: var(--warn);
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Weather Insights App</h1>
    <p class="muted">Portfolio embedded demo: current weather, hourly preview, and alert state.</p>

    <section class="row" style="margin-top: 16px;">
      <article class="card">
        <h2>Current Conditions</h2>
        <div class="temp" id="temp">72°</div>
        <p id="summary">Partly Cloudy - Feels like 74°</p>
        <p class="muted">Wind 9 mph · Humidity 54% · UV 6</p>
        <div class="alert" id="alert">Advisory: Gusty winds expected after 5 PM.</div>
      </article>

      <article class="card">
        <h2>Next 12 Hours</h2>
        <div class="forecast" id="forecast"></div>
      </article>
    </section>
  </div>

  <script>
    const hourly = [
      { hour: '1 PM', t: 72, icon: '⛅' },
      { hour: '4 PM', t: 74, icon: '🌤️' },
      { hour: '7 PM', t: 69, icon: '🌥️' },
      { hour: '10 PM', t: 64, icon: '🌙' }
    ];

    const forecast = document.getElementById('forecast');
    hourly.forEach((slot) => {
      const cell = document.createElement('div');
      cell.className = 'pill';
      cell.innerHTML = '<div>' + slot.hour + '</div><div style="font-size:18px; margin:4px 0;">' + slot.icon + '</div><strong>' + slot.t + '°</strong>';
      forecast.appendChild(cell);
    });

    const temps = [72, 74, 69, 64];
    setInterval(() => {
      const t = temps[Math.floor(Math.random() * temps.length)];
      document.getElementById('temp').textContent = t + '°';
      document.getElementById('summary').textContent = 'Partly Cloudy - Feels like ' + (t + 1) + '°';
    }, 4000);
  </script>
</body>
</html>
