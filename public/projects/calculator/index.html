<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      opacity: 0.85;
    }

    .calc-wrapper {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 340px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tool-btn {
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .display {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
    }

    .display .expression {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      min-height: 1.2em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display .current {
      font-size: 2.4rem;
      font-weight: 300;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .memory-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .memory-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.25);
      color: #cbd5e1;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 10px 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .memory-btn:hover {
      background: rgba(15, 23, 42, 0.45);
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 500;
      padding: 18px 8px;
      cursor: pointer;
      transition: transform 0.08s, opacity 0.15s;
      outline: none;
      user-select: none;
    }

    button:active { transform: scale(0.93); }
    button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }

    .btn-num {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .btn-num:hover { background: rgba(255, 255, 255, 0.22); }

    .btn-op {
      background: rgba(96, 165, 250, 0.3);
      color: #93c5fd;
    }
    .btn-op:hover { background: rgba(96, 165, 250, 0.45); }

    .btn-clear {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }
    .btn-clear:hover { background: rgba(239, 68, 68, 0.4); }

    .btn-eq {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    .btn-eq:hover { background: #1d4ed8; }

    .btn-zero { grid-column: span 2; }

    .history-section {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      max-height: 120px;
      overflow-y: auto;
    }

    .history-title {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .history-item {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .history-item:last-child { border-bottom: none; }

    .hint {
      color: rgba(255,255,255,0.3);
      font-size: 0.72rem;
      text-align: center;
      margin-top: 14px;
    }

    .announce {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>🧮 Calculator</h1>

  <div class="calc-wrapper">
    <div class="toolbar">
      <button class="tool-btn" onclick="clearHistory()" aria-label="Clear calculation history">Clear History</button>
      <button class="tool-btn" onclick="copyCurrent()" aria-label="Copy current value">Copy Value</button>
    </div>

    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="memory-buttons">
      <button class="memory-btn" onclick="memoryClear()" aria-label="Clear memory">MC</button>
      <button class="memory-btn" onclick="memoryRecall()" aria-label="Recall memory">MR</button>
      <button class="memory-btn" onclick="memoryAdd()" aria-label="Add current value to memory">M+</button>
      <button class="memory-btn" onclick="memorySubtract()" aria-label="Subtract current value from memory">M-</button>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn-clear" onclick="clearAll()" aria-label="Clear all">AC</button>
      <button class="btn-clear" onclick="toggleSign()" aria-label="Toggle sign">+/−</button>
      <button class="btn-op"    onclick="percentage()" aria-label="Percent">%</button>
      <button class="btn-op"    onclick="setOp('/')" aria-label="Divide">÷</button>
      <!-- Row 2 -->
      <button class="btn-num"   onclick="digit('7')">7</button>
      <button class="btn-num"   onclick="digit('8')">8</button>
      <button class="btn-num"   onclick="digit('9')">9</button>
      <button class="btn-op"    onclick="setOp('*')" aria-label="Multiply">×</button>
      <!-- Row 3 -->
      <button class="btn-num"   onclick="digit('4')">4</button>
      <button class="btn-num"   onclick="digit('5')">5</button>
      <button class="btn-num"   onclick="digit('6')">6</button>
      <button class="btn-op"    onclick="setOp('-')" aria-label="Subtract">−</button>
      <!-- Row 4 -->
      <button class="btn-num"   onclick="digit('1')">1</button>
      <button class="btn-num"   onclick="digit('2')">2</button>
      <button class="btn-num"   onclick="digit('3')">3</button>
      <button class="btn-op"    onclick="setOp('+')" aria-label="Add">+</button>
      <!-- Row 5 -->
      <button class="btn-num btn-zero" onclick="digit('0')">0</button>
      <button class="btn-num"   onclick="dot()">.</button>
      <button class="btn-eq"    onclick="calculate()" aria-label="Equals">=</button>
    </div>

    <div class="history-section" id="history-section">
      <div class="history-title">History</div>
      <div id="history"></div>
    </div>
  </div>

  <div id="announce" class="announce" role="status" aria-live="polite"></div>
  <p class="hint">Keyboard supported: 0–9 · + − * / Enter Backspace</p>

  <script>
    let current = '0';
    let prev = '';
    let operator = null;
    let justCalc = false;
    let memory = 0;
    const MAX_DIGITS = 12;
    const HISTORY_STORAGE_KEY = 'portfolio_calculator_history_v1';

    const $cur  = document.getElementById('current');
    const $expr = document.getElementById('expression');
    const $hist = document.getElementById('history');
    const $announce = document.getElementById('announce');

    function render() {
      $cur.textContent = formatNum(current);
      $expr.textContent = prev && operator
        ? formatNum(prev) + ' ' + opSymbol(operator)
        : '';
    }

    function formatNum(n) {
      const num = parseFloat(n);
      if (isNaN(num)) return n;
      const s = n.includes('.') && !justCalc ? n : String(num);
      return s.length > 14 ? num.toPrecision(10) : s;
    }

    function opSymbol(op) {
      return { '+': '+', '-': '−', '*': '×', '/': '÷' }[op] || op;
    }

    function digit(d) {
      if (justCalc) { current = '0'; justCalc = false; }
      if (current === '0' && d !== '.') {
        current = d;
      } else if (current.replace('.', '').replace('-', '').length < MAX_DIGITS) {
        current += d;
      }
      render();
    }

    function dot() {
      if (justCalc) { current = '0'; justCalc = false; }
      if (!current.includes('.')) current += '.';
      render();
    }

    function setOp(op) {
      if (operator && !justCalc) compute(false);
      prev = current;
      operator = op;
      justCalc = false;
      current = '0';
      render();
    }

    function compute(final) {
      if (!operator || !prev) return;
      const a = parseFloat(prev);
      const b = parseFloat(current);
      const exprStr = formatNum(prev) + ' ' + opSymbol(operator) + ' ' + formatNum(current) + ' =';
      let result;
      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/': result = b === 0 ? 'Error' : a / b; break;
        default: return;
      }
      if (final) {
        addHistory(exprStr + ' ' + (result === 'Error' ? result : formatNum(String(result))));
      }
      current = result === 'Error' ? 'Error' : String(parseFloat(result.toFixed(10)));
      prev = '';
      operator = null;
    }

    function calculate() {
      compute(true);
      justCalc = true;
      render();
    }

    function clearAll() {
      current = '0'; prev = ''; operator = null; justCalc = false;
      render();
    }

    function announce(message) {
      $announce.textContent = message;
    }

    function toggleSign() {
      if (current !== '0' && current !== 'Error') {
        current = current.startsWith('-') ? current.slice(1) : '-' + current;
        render();
      }
    }

    function percentage() {
      const n = parseFloat(current);
      if (!isNaN(n)) { current = String(n / 100); render(); }
    }

    function addHistory(entry) {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.textContent = entry;
      $hist.prepend(div);
      while ($hist.children.length > 10) $hist.removeChild($hist.lastChild);
      persistHistory();
    }

    function historyEntries() {
      return Array.from($hist.children).map((child) => child.textContent).filter(Boolean);
    }

    function persistHistory() {
      localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyEntries()));
    }

    function loadHistory() {
      const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
      if (!raw) {
        return;
      }

      try {
        const entries = JSON.parse(raw);
        if (!Array.isArray(entries)) {
          return;
        }

        entries.slice().reverse().forEach((entry) => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.textContent = String(entry);
          $hist.prepend(div);
        });
      } catch {
        // Ignore malformed storage values.
      }
    }

    function clearHistory() {
      $hist.innerHTML = '';
      localStorage.removeItem(HISTORY_STORAGE_KEY);
      announce('History cleared');
    }

    async function copyCurrent() {
      try {
        await navigator.clipboard.writeText(current);
        announce('Current value copied');
      } catch {
        announce('Unable to copy current value');
      }
    }

    function parseCurrentValue() {
      const value = parseFloat(current);
      return Number.isFinite(value) ? value : 0;
    }

    function memoryClear() {
      memory = 0;
      announce('Memory cleared');
    }

    function memoryRecall() {
      current = String(memory);
      justCalc = false;
      render();
      announce('Memory recalled');
    }

    function memoryAdd() {
      memory += parseCurrentValue();
      announce('Added to memory');
    }

    function memorySubtract() {
      memory -= parseCurrentValue();
      announce('Subtracted from memory');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') digit(e.key);
      else if (e.key === '.') dot();
      else if (e.key === '+') setOp('+');
      else if (e.key === '-') setOp('-');
      else if (e.key === '*') setOp('*');
      else if (e.key === '/') { e.preventDefault(); setOp('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        render();
      } else if (e.key === 'Escape') clearAll();
    });

    loadHistory();
    render();
  </script>

</body>
</html>
