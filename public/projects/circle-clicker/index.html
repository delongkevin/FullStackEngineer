<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Clicker</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: red;
            position: absolute;
            cursor: pointer;
        }
        #score {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #timer {
            font-size: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="level">Level: 1</div>
    <div id="timer">Time Left: 30</div>
    <script>
        let score = 0;
        let level = 1;
        let timeLeft = 30;
        let spawnRate = 1000; // milliseconds
        let countdown;

        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const timerDisplay = document.getElementById('timer');

        function startGame() {
            countdown = setInterval(updateTimer, 1000);
            spawnCircle();
        }

        function updateTimer() {
            timeLeft--;
            timerDisplay.textContent = `Time Left: ${timeLeft}`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                alert(`Game Over! Final Score: ${score}`);
            }
        }

        function spawnCircle() {
            const circle = document.createElement('div');
            circle.id = 'circle';
            circle.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            circle.style.left = Math.random() * (window.innerWidth - 50) + 'px';
            circle.addEventListener('click', () => {
                score += 1;
                scoreDisplay.textContent = `Score: ${score}`;
                circle.remove();
                if (score % 5 === 0) {
                    levelUp();
                }
                spawnCircle();
            });
            document.body.appendChild(circle);
        }

        function levelUp() {
            level += 1;
            levelDisplay.textContent = `Level: ${level}`;
            spawnRate = Math.max(200, spawnRate - 100); // Decrease spawn rate
            clearInterval(countdown);
            timeLeft += 5; // add 5 seconds for level up
            timeLeft = Math.min(timeLeft, 30); // limit max time to 30 seconds
            countdown = setInterval(updateTimer, 1000);
            setTimeout(spawnCircle, spawnRate);
        }

        startGame();
    </script>
</body>
</html>
