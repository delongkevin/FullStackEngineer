<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Color Match Challenge</title><style>* {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;} html, body {width: 100%; height: 100%;} body {display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); padding: 10px; overflow-y: auto; position: fixed; top: 0; left: 0; right: 0; bottom: 0;} .game-container {background-color: rgba(255, 255, 255, 0.98); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); padding: clamp(15px, 5vw, 30px); width: 100%; max-width: 600px; max-height: 95vh; overflow-y: auto; text-align: center; position: relative; z-index: 1000;} h1 {color: #333; margin-bottom: 10px; font-size: clamp(1.8rem, 5vw, 2.5rem); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);} .subtitle {color: #666; font-size: clamp(0.85rem, 2vw, 1rem); margin-bottom: 15px;} .game-info {display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-size: clamp(0.85rem, 2.5vw, 1.2rem); font-weight: bold;} .info-box {background: linear-gradient(135deg, #e0e7ff, #cffafe); padding: clamp(8px, 2vw, 12px); border-radius: 10px; border-left: 4px solid #3b82f6;} .info-label {color: #666; font-size: clamp(0.75rem, 2vw, 0.9rem);} .info-value {color: #1e40af; font-size: clamp(1.2rem, 3.5vw, 1.8rem); margin-top: 4px;} .target-color-section {margin: 20px 0;} .target-label {color: #666; font-size: clamp(0.9rem, 2.5vw, 1.1rem); margin-bottom: 10px; font-weight: 600;} .target-color {width: clamp(120px, 40vw, 180px); height: clamp(70px, 20vw, 100px); margin: 0 auto; border-radius: 10px; border: 3px solid #333; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); transition: transform 0.2s;} .target-color:active {transform: scale(0.98);} .color-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(80px, 25vw, 140px), 1fr)); gap: clamp(10px, 2vw, 15px); margin: 20px 0; min-height: 200px;} .color-option {aspect-ratio: 1; border-radius: 10px; cursor: pointer; transition: all 0.2s; border: 3px solid transparent; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); user-select: none; touch-action: manipulation;} .color-option:hover {transform: scale(1.05); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);} .color-option:active {transform: scale(0.98);} .color-option.correct {border-color: #4CAF50; box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);} .color-option.wrong {border-color: #f44336; box-shadow: 0 0 20px rgba(244, 67, 54, 0.5);} .controls {margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;} button {background: linear-gradient(to right, #4CAF50, #45a049); border: none; color: white; padding: clamp(10px, 2vw, 15px) clamp(20px, 5vw, 30px); font-size: clamp(0.9rem, 2.5vw, 1.1rem); cursor: pointer; border-radius: 50px; transition: all 0.3s; font-weight: bold;} button:hover {transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);} button:active {transform: translateY(0);} .message {font-size: clamp(1rem, 3vw, 1.5rem); margin-top: 15px; font-weight: bold; min-height: 30px;} .success {color: #4CAF50;} .error {color: #f44336;} @media (max-width: 480px) {.game-container {padding: 12px;} .color-grid {grid-template-columns: repeat(2, 1fr); gap: 10px;} .game-info {gap: 8px;}} @media (max-width: 360px) {.color-grid {grid-template-columns: repeat(2, 1fr);} .target-color {width: 100px; height: 60px;}}</style></head><body><div class="game-container"><h1>🎨 Color Match Challenge</h1><p class="subtitle">Match the target color with the options below!</p><div class="game-info"><div class="info-box"><div class="info-label">Score</div><div class="info-value" id="score">0</div></div><div class="info-box"><div class="info-label">Rounds</div><div class="info-value" id="round">1/5</div></div></div><div class="target-color-section"><div class="target-label">Find this color:</div><div class="target-color" id="targetColor"></div></div><div class="color-grid" id="colorGrid"></div><div class="controls"><button onclick="startGame()">Start Game</button><button onclick="resetGame()">Reset</button></div><div class="message" id="message"></div></div><script>let score = 0; let round = 1; const maxRounds = 5; let gameActive = false; let targetColor = ''; let colorOptions = []; let answered = false; function generateRandomColor() {return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');} function startGame() {if (gameActive && round > maxRounds) {score = 0; round = 1;} gameActive = true; answered = false; nextRound();} function nextRound() {if (round > maxRounds) {endGame(); return;} answered = false; targetColor = generateRandomColor(); colorOptions = [targetColor]; const optionCount = Math.floor(Math.random() * 4) + 5; while (colorOptions.length < optionCount) {const color = generateRandomColor(); if (!colorOptions.includes(color)) {colorOptions.push(color);}} colorOptions.sort(() => Math.random() - 0.5); document.getElementById('targetColor').style.backgroundColor = targetColor; renderColorGrid(); updateDisplay(); showMessage('', '');} function renderColorGrid() {const grid = document.getElementById('colorGrid'); grid.innerHTML = ''; colorOptions.forEach(color => {const div = document.createElement('div'); div.className = 'color-option'; div.style.backgroundColor = color; div.onclick = () => checkColor(color, div); grid.appendChild(div);});} function checkColor(color, element) {if (answered) return; answered = true; if (color === targetColor) {score++; element.classList.add('correct'); showMessage('✓ Correct!', 'success'); setTimeout(() => {round++; nextRound();}, 1000);} else {element.classList.add('wrong'); document.querySelector('.color-option[style*="' + targetColor + '"]').classList.add('correct'); showMessage('✗ Wrong! Try again', 'error'); setTimeout(() => {round++; nextRound();}, 1500);}} function updateDisplay() {document.getElementById('score').textContent = score; document.getElementById('round').textContent = round + '/' + maxRounds;} function endGame() {gameActive = false; showMessage(`Game Over! Final Score: ${score}/${maxRounds}`, 'success');} function resetGame() {gameActive = false; score = 0; round = 1; answered = false; updateDisplay(); document.getElementById('colorGrid').innerHTML = ''; document.getElementById('targetColor').style.backgroundColor = '#ffffff'; showMessage('Ready to play?', '');} function showMessage(text, className) {const msg = document.getElementById('message'); msg.textContent = text; msg.className = className;}</script></body></html>
