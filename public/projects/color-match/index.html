<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match Challenge</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; }
        #color-box { width: 200px; height: 200px; margin: 20px auto; border: 2px solid #ccc; }
        .button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
        .correct { border-color: green; }
        .incorrect { border-color: red; }
    </style>
</head>
<body>
    <h1>Color Match Challenge</h1>
    <div id="color-box"></div>
    <div id="score-panel">
        <p>Score: <span id="score">0</span></p>
        <p>Accuracy: <span id="accuracy">0</span>%</p>
    </div>
    <button id="start-button" class="button">Start Game</button>
    <button id="next-button" class="button" style="display:none;">Next</button>
    <button id="reset-button" class="button" style="display:none;">Reset</button>
    <div id="message"></div>
    <script>
        let score = 0;
        let rounds = 5;
        let currentRound = 0;
        let correctColor = '';
        let userSelections = [];

        function startGame() {
            score = 0;
            currentRound = 0;
            userSelections = [];
            document.getElementById('score').innerText = score;
            document.getElementById('accuracy').innerText = '0';
            document.getElementById('next-button').style.display = 'none';
            document.getElementById('reset-button').style.display = 'none';
            document.getElementById('message').innerText = '';
            nextRound();
        }

        function nextRound() {
            if (currentRound < rounds) {
                currentRound++;
                generateColor();
            } else {
                gameOver();
            }
        }

        function generateColor() {
            const randomColor = `#${Math.floor(Math.random() * 16777215).toString(16)}`;
            correctColor = randomColor;
            document.getElementById('color-box').style.backgroundColor = correctColor;
            document.getElementById('message').innerText = `Round ${currentRound}: Select the matching color!`;
        }

        function selectColor(color) {
            userSelections.push(color);
            if (color === correctColor) {
                score++;
                document.getElementById('color-box').classList.add('correct');
                document.getElementById('message').innerText = 'Correct!';
            } else {
                document.getElementById('color-box').classList.add('incorrect');
                document.getElementById('message').innerText = 'Incorrect!';
            }
            updateScore();
            setTimeout(() => {
                document.getElementById('color-box').classList.remove('correct', 'incorrect');
                nextRound();
            }, 1000);
        }

        function updateScore() {
            document.getElementById('score').innerText = score;
            document.getElementById('accuracy').innerText = ((score / currentRound) * 100).toFixed(2);
        }

        function gameOver() {
            document.getElementById('message').innerText = `Game Over! Final Score: ${score}. Accuracy: ${((score / rounds) * 100).toFixed(2)}%`;
            document.getElementById('next-button').style.display = 'none';
            document.getElementById('reset-button').style.display = 'block';
        }

        document.getElementById('start-button').onclick = startGame;
        document.getElementById('next-button').onclick = nextRound;
        document.getElementById('reset-button').onclick = startGame;
    </script>
</body>
</html>
