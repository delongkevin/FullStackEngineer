<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .color-option { width: 100px; height: 100px; display: inline-block; margin: 20px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Color Match Game</h1>
    <div id="game">
        <div id="target-color" style="font-size: 24px; margin-bottom: 20px;"></div>
        <div id="options"></div>
        <button id="start-btn">Start Game</button>
        <div id="score-display">Score: 0</div>
        <div id="lives-display">Lives: 3</div>
        <div id="round-display">Round: 1</div>
        <div id="game-over" class="hidden">Game Over!</div>
    </div>
    <script>
        let score = 0;
        let lives = 3;
        let round = 1;

        function startGame() {
            score = 0;
            lives = 3;
            round = 1;
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('start-btn').style.display = 'none';
            nextRound();
        }

        function nextRound() {
            if (lives <= 0) {
                endGame();
                return;
            }
            round++;
            document.getElementById('round-display').innerText = 'Round: ' + round;
            generateColors();
        }

        function generateColors() {
            const targetColor = getRandomColor();
            document.getElementById('target-color').innerText = targetColor;
            document.getElementById('options').innerHTML = '';

            for (let i = 0; i < 4; i++) {
                const color = getRandomColor();
                const colorOption = document.createElement('div');
                colorOption.classList.add('color-option');
                colorOption.style.backgroundColor = color;
                colorOption.addEventListener('click', function() { checkAnswer(color, targetColor); });
                document.getElementById('options').appendChild(colorOption);
            }

            document.getElementById('options').children[Math.floor(Math.random() * 4)].style.backgroundColor = targetColor; // Ensure one correct option
        }

        function checkAnswer(selectedColor, targetColor) {
            if (selectedColor === targetColor) {
                score += 10;
                document.getElementById('score-display').innerText = 'Score: ' + score;
                nextRound();
            } else {
                lives--;
                document.getElementById('lives-display').innerText = 'Lives: ' + lives;
                nextRound();
            }
        }

        function endGame() {
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('start-btn').style.display = 'block';
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
