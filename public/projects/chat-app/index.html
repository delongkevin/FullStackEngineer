<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat App Demo</title>
  <style>
    :root {
      --bg: #0d1025;
      --panel: #161b38;
      --panel-2: #1f2850;
      --text: #f8fafc;
      --muted: #adb9d9;
      --accent: #818cf8;
      --good: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: radial-gradient(circle at 80% 0%, #2a2f63 0, #0d1025 60%);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; color: var(--muted); }
    .list { margin-top: 16px; display: grid; gap: 10px; }
    .row {
      background: var(--panel);
      border: 1px solid #2a3566;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); display: grid; place-items: center; font-weight: 700;
    }
    .name { font-weight: 700; }
    .msg { color: var(--muted); font-size: 14px; }
    .badge { background: var(--good); color: #052e1f; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Real-time Chat App</h1>
    <p>Embedded preview for conversation list, presence, and instant messaging UX.</p>

    <section class="list">
      <article class="row">
        <div class="avatar">A</div>
        <div><div class="name">Alice Johnson</div><div class="msg">Are we shipping the update today?</div></div>
        <span class="badge">2m</span>
      </article>
      <article class="row" style="background:var(--panel-2)">
        <div class="avatar" style="background:#10b981">T</div>
        <div><div class="name">Team Alpha</div><div class="msg">Build passed. Ready for QA review.</div></div>
        <span class="badge">15m</span>
      </article>
      <article class="row">
        <div class="avatar" style="background:#f59e0b">B</div>
        <div><div class="name">Bob Smith</div><div class="msg">I can jump on a quick call in 10.</div></div>
        <span class="badge">1h</span>
      </article>
      <article class="row">
        <div class="avatar" style="background:#ec4899">M</div>
        <div><div class="name">Mom</div><div class="msg">Call me when you are free.</div></div>
        <span class="badge">2d</span>
      </article>
    </section>
  </div>
</body>
</html>
