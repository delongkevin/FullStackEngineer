    <rect x="180" y="260" width="8" height="110" rx="4" fill="url(#accent)"/>
    <rect x="200" y="230" width="8" height="170" rx="4" fill="url(#accent)"/>
    <rect x="220" y="250" width="8" height="130" rx="4" fill="url(#accent)"/>
    <rect x="240" y="280" width="8" height="70" rx="4" fill="url(#accent)"/>
    <rect x="260" y="260" width="8" height="110" rx="4" fill="url(#accent)"/>
    <rect x="280" y="240" width="8" height="150" rx="4" fill="url(#accent)"/>
    <rect x="920" y="280" width="8" height="70" rx="4" fill="url(#accent)"/>
    <rect x="940" y="250" width="8" height="130" rx="4" fill="url(#accent)"/>
    <rect x="960" y="270" width="8" height="90" rx="4" fill="url(#accent)"/>
    <rect x="980" y="240" width="8" height="150" rx="4" fill="url(#accent)"/>
    <rect x="1000" y="260" width="8" height="110" rx="4" fill="url(#accent)"/>
    <rect x="1020" y="230" width="8" height="170" rx="4" fill="url(#accent)"/>
    <rect x="1040" y="250" width="8" height="130" rx="4" fill="url(#accent)"/>
    <rect x="1060" y="280" width="8" height="70" rx="4" fill="url(#accent)"/>
    <rect x="1080" y="260" width="8" height="110" rx="4" fill="url(#accent)"/>
    <rect x="1100" y="240" width="8" height="150" rx="4" fill="url(#accent)"/>
  </g>
  <!-- Central icon -->
  <circle cx="600" cy="280" r="80" fill="url(#accent)" opacity="0.15"/>
  <circle cx="600" cy="280" r="55" fill="url(#accent)" opacity="0.25"/>
  <text x="600" y="295" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">AP</text>
