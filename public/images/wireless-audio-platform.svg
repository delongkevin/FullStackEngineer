  <text x="600" y="420" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#f1f5f9">Wireless Audio Platform</text>
  <text x="600" y="460" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#94a3b8">Sr. Software Engineer - TypeScript | Node.js | AWS | MongoDB | C++ | GraphQL | Angular</text>
  <!-- Tech badges -->
  <g font-family="sans-serif" font-size="13" font-weight="600">
    <rect x="310" y="500" width="90" height="28" rx="6" fill="#3178c622" stroke="#3178c6" stroke-width="1"/>
    <text x="355" y="518" text-anchor="middle" fill="#3178c6">TypeScript</text>
    <rect x="410" y="500" width="75" height="28" rx="6" fill="#68a06322" stroke="#68a063" stroke-width="1"/>
    <text x="447" y="518" text-anchor="middle" fill="#68a063">Node.js</text>
    <rect x="495" y="500" width="80" height="28" rx="6" fill="#ff990022" stroke="#ff9900" stroke-width="1"/>
