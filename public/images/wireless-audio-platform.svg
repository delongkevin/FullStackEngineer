    <rect x="680" y="500" width="60" height="28" rx="6" fill="#00599c22" stroke="#00599c" stroke-width="1"/>
    <text x="710" y="518" text-anchor="middle" fill="#00599c">C++</text>
    <rect x="750" y="500" width="80" height="28" rx="6" fill="#e535ab22" stroke="#e535ab" stroke-width="1"/>
    <text x="790" y="518" text-anchor="middle" fill="#e535ab">GraphQL</text>
    <rect x="840" y="500" width="78" height="28" rx="6" fill="#dd003122" stroke="#dd0031" stroke-width="1"/>
    <text x="879" y="518" text-anchor="middle" fill="#dd0031">Angular</text>
