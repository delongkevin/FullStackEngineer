<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005ec5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f2f2f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Phone frame -->
  <rect x="270" y="20" width="260" height="460" rx="32" fill="#1c1c1e" filter="url(#shadow)"/>
  <rect x="278" y="28" width="244" height="444" rx="26" fill="url(#cardBg)"/>

  <!-- Status bar -->
  <rect x="278" y="28" width="244" height="44" rx="26" fill="white"/>
  <rect x="278" y="52" width="244" height="20" fill="white"/>
  <!-- Notch -->
  <rect x="355" y="30" width="90" height="22" rx="11" fill="#1c1c1e"/>

  <!-- App Header -->
  <rect x="278" y="72" width="244" height="44" fill="white"/>
  <!-- Heart-pulse icon -->
  <rect x="290" y="82" width="26" height="26" rx="7" fill="#0a84ff"/>
  <polyline points="293,95 297,95 300,91 303,99 306,87 309,95 312,95" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="322" y="100" font-family="SF Pro, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1c1e">MedIoT Connect</text>
  <!-- LIVE badge -->
  <rect x="462" y="84" width="36" height="18" rx="9" fill="#30d158"/>
  <text x="480" y="97" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">LIVE</text>

  <!-- Divider -->
  <line x1="278" y1="116" x2="522" y2="116" stroke="#e5e5ea" stroke-width="1"/>

  <!-- Vitals Section Label -->
  <text x="290" y="138" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366" letter-spacing="0.5">LIVE VITALS · ROOM 302</text>

  <!-- Vital Cards Grid (2x2) -->
  <!-- HR Card -->
  <rect x="286" y="144" width="112" height="70" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="296" y="162" font-family="sans-serif" font-size="16">❤️</text>
  <text x="296" y="176" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">HEART RATE</text>
  <text x="296" y="198" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1c1c1e">72</text>
  <text x="318" y="198" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="#636366">bpm</text>
  <text x="296" y="210" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366">→ Normal</text>

  <!-- SpO2 Card -->
  <rect x="404" y="144" width="112" height="70" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="414" y="162" font-family="sans-serif" font-size="16">🫧</text>
  <text x="414" y="176" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">SPO₂</text>
  <text x="414" y="198" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1c1c1e">97</text>
  <text x="434" y="198" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="#636366">%</text>
  <text x="414" y="210" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#30d158">↑ Good</text>

  <!-- Temp Card -->
  <rect x="286" y="222" width="112" height="70" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="296" y="240" font-family="sans-serif" font-size="16">🌡️</text>
  <text x="296" y="254" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">TEMPERATURE</text>
  <text x="296" y="276" font-family="SF Pro, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1c1c1e">98.4</text>
  <text x="296" y="288" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366">→ Normal °F</text>

  <!-- BP Card -->
  <rect x="404" y="222" width="112" height="70" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="414" y="240" font-family="sans-serif" font-size="16">💉</text>
  <text x="414" y="254" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" font-weight="600">BLOOD PRESSURE</text>
  <text x="414" y="276" font-family="SF Pro, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1c1c1e">118/76</text>
  <text x="414" y="288" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#30d158">↑ Optimal</text>

  <!-- ECG Card -->
  <rect x="286" y="300" width="230" height="60" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="296" y="316" font-family="SF Pro, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#636366" letter-spacing="0.5">ECG TRACE (LIVE BLE FEED)</text>
  <!-- ECG waveform simulation -->
  <polyline points="292,345 305,345 310,345 313,325 316,355 320,340 325,345 340,345 343,325 346,355 350,340 355,345 370,345 373,325 376,355 380,340 385,345 400,345 403,325 406,355 410,340 415,345 430,345 433,325 436,355 440,340 445,345 510,345" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Nav -->
  <rect x="278" y="428" width="244" height="44" rx="0" fill="white"/>
  <rect x="278" y="428" width="244" height="2" fill="#e5e5ea"/>
  <rect x="278" y="456" width="244" height="16" rx="0" fill="white"/>
  <!-- Nav icons -->
  <rect x="290" y="432" width="44" height="22" rx="6" fill="#e8f1ff"/>
  <text x="312" y="448" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#0a84ff" text-anchor="middle" font-weight="600">Dashboard</text>
  <text x="363" y="448" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" text-anchor="middle">Devices</text>
  <text x="420" y="448" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" text-anchor="middle">Wearables</text>
  <text x="473" y="448" font-family="SF Pro, -apple-system, sans-serif" font-size="8" fill="#636366" text-anchor="middle">API</text>

  <!-- Left side info panel -->
  <text x="40" y="70" font-family="SF Pro, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white">Medical IoT</text>
  <text x="40" y="96" font-family="SF Pro, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white">Device Monitor</text>
  <text x="40" y="128" font-family="SF Pro, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">Cross-platform mobile app demo</text>
  <text x="40" y="148" font-family="SF Pro, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">for DornerWorks application</text>

  <!-- Feature badges left -->
  <rect x="40" y="172" width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="85" y="189" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">iOS · Swift</text>

  <rect x="138" y="172" width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="183" y="189" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Android · Kotlin</text>

  <rect x="40" y="204" width="80" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="80" y="221" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Flutter</text>

  <rect x="128" y="204" width="110" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="183" y="221" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">React Native</text>

  <!-- Key highlights -->
  <text x="40" y="268" font-family="SF Pro, -apple-system, sans-serif" font-size="12" font-weight="700" fill="white">Key Highlights</text>
  <circle cx="50" cy="290" r="3" fill="#30d158"/>
  <text x="62" y="294" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">BLE 5.x / NFC connectivity</text>
  <circle cx="50" cy="312" r="3" fill="#30d158"/>
  <text x="62" y="316" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Real-time REST API integration</text>
  <circle cx="50" cy="334" r="3" fill="#30d158"/>
  <text x="62" y="338" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Apple Watch / Wear OS / Garmin</text>
  <circle cx="50" cy="356" r="3" fill="#30d158"/>
  <text x="62" y="360" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">HIPAA security + OAuth 2.0</text>
  <circle cx="50" cy="378" r="3" fill="#30d158"/>
  <text x="62" y="382" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Medical &amp; IoT device management</text>
  <circle cx="50" cy="400" r="3" fill="#30d158"/>
  <text x="62" y="404" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Cross-platform UI/UX design</text>

  <!-- Right side decorative elements -->
  <text x="560" y="80" font-family="SF Pro, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white">DornerWorks</text>
  <text x="560" y="100" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Senior Mobile Developer</text>
  <text x="560" y="118" font-family="SF Pro, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Application Demo</text>

  <!-- Wearable icons right side -->
  <rect x="560" y="145" width="200" height="60" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="168" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Wearable Support</text>
  <text x="590" y="192" font-family="sans-serif" font-size="20" text-anchor="middle">⌚</text>
  <text x="590" y="204" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Apple Watch</text>
  <text x="660" y="192" font-family="sans-serif" font-size="20" text-anchor="middle">📱</text>
  <text x="660" y="204" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Wear OS</text>
  <text x="730" y="192" font-family="sans-serif" font-size="20" text-anchor="middle">🏃</text>
  <text x="730" y="204" font-family="SF Pro, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Garmin</text>

  <!-- Tech stack right -->
  <rect x="560" y="225" width="200" height="130" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="246" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Tech Stack</text>
  <text x="578" y="266" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Swift / Xcode</text>
  <text x="578" y="284" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Kotlin / Android Studio</text>
  <text x="578" y="302" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Flutter / Dart</text>
  <text x="578" y="320" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">React Native / TypeScript</text>
  <text x="578" y="338" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">RESTful APIs / OAuth 2.0</text>
  <text x="578" y="356" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">BLE 5.x / NFC / MQTT</text>

  <!-- Bottom badge -->
  <rect x="560" y="380" width="200" height="70" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="660" y="404" font-family="SF Pro, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">5+ Years Experience</text>
  <text x="660" y="424" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">iOS &amp; Android Development</text>
  <text x="660" y="442" font-family="SF Pro, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Medical &amp; IoT Products</text>
</svg>
