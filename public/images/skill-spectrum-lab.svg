<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skill Spectrum Lab</title>
  <desc id="desc">Abstract dashboard-style illustration representing full-stack engineering coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a36"/>
      <stop offset="100%" stop-color="#1f4a91"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#284d92"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="660" rx="28" fill="#0f1f40" stroke="#335a9b" stroke-width="3"/>
  <rect x="110" y="120" width="980" height="110" rx="16" fill="url(#card)"/>
  <text x="145" y="185" fill="#eaf2ff" font-size="44" font-family="Inter, Arial, sans-serif" font-weight="700">Skill Spectrum Lab</text>
  <text x="145" y="218" fill="#d7e5ff" font-size="24" font-family="Inter, Arial, sans-serif">Full-stack capability command center</text>

  <g fill="#152a55" stroke="#2f5699" stroke-width="2">
    <rect x="110" y="265" width="300" height="180" rx="14"/>
    <rect x="450" y="265" width="300" height="180" rx="14"/>
    <rect x="790" y="265" width="300" height="180" rx="14"/>
    <rect x="110" y="480" width="980" height="210" rx="14"/>
  </g>

  <g fill="#9cc0ff" font-family="Inter, Arial, sans-serif">
    <text x="134" y="305" font-size="24" font-weight="600">Delivery Board</text>
    <text x="474" y="305" font-size="24" font-weight="600">Integration Health</text>
    <text x="814" y="305" font-size="24" font-weight="600">Quality Gate</text>
    <text x="134" y="520" font-size="24" font-weight="600">Execution Log</text>
  </g>

  <g>
    <rect x="134" y="336" width="252" height="12" rx="6" fill="#3f70c4"/>
    <rect x="134" y="362" width="215" height="12" rx="6" fill="#5fa2ff"/>
    <rect x="134" y="388" width="184" height="12" rx="6" fill="#85c0ff"/>
    <circle cx="690" cy="355" r="52" fill="#193466" stroke="#4f8cff" stroke-width="4"/>
    <circle cx="690" cy="355" r="29" fill="#5fa2ff"/>
    <rect x="814" y="340" width="230" height="16" rx="8" fill="#5fa2ff"/>
    <rect x="814" y="370" width="198" height="16" rx="8" fill="#83bcff"/>
    <rect x="814" y="400" width="165" height="16" rx="8" fill="#a7d2ff"/>
  </g>

  <g fill="#6ea8ff" font-family="Inter, Arial, sans-serif" font-size="20">
    <text x="145" y="575">React · TypeScript · Next.js · JavaScript · Node.js · Python · MongoDB · PostgreSQL</text>
    <text x="145" y="610">Firebase · Git · Docker · AWS · Figma · Jest · HTML5 · CSS3</text>
