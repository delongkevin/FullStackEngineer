name: Real Estate CI

on:
  push:
    paths:
      - 'real-estate-app/**'
      - '.github/workflows/real-estate-ci.yml'
  pull_request:
    paths:
      - 'real-estate-app/**'
      - '.github/workflows/real-estate-ci.yml'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-estate-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: real-estate-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --runInBand
