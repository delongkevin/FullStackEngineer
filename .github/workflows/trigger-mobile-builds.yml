name: Trigger Mobile App Builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag ref to build'
        required: true
        default: 'main'

permissions:
  actions: write
  contents: read

jobs:
  trigger-mobile-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Validate ref and target workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          if [[ ! "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Ref '$REF' contains unsupported characters."
            exit 1
          fi

          if gh api "repos/$REPO/git/ref/heads/$REF" >/dev/null 2>&1 || \
             gh api "repos/$REPO/git/ref/tags/$REF" >/dev/null 2>&1 || \
             gh api "repos/$REPO/commits/$REF" >/dev/null 2>&1; then
            echo "Using ref: $REF"
          else
            echo "::error::Ref '$REF' does not exist as a branch, tag, or commit in $REPO."
            exit 1
          fi

          gh workflow view release-android.yml --repo "$REPO" >/dev/null
          gh workflow view release-ios.yml --repo "$REPO" >/dev/null

      - name: Trigger Android and iOS build workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release-android.yml --repo "${{ github.repository }}" --ref "${{ github.event.inputs.ref }}"
          gh workflow run release-ios.yml --repo "${{ github.repository }}" --ref "${{ github.event.inputs.ref }}"
