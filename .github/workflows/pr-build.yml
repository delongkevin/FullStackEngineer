name: PR Build Check

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Build & Export
        run: npm run build

      - name: Upload HTML output
        uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: out/
          retention-days: 7
