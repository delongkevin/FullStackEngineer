name: PR Build Preview

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Export to HTML
        run: npm run build

      - name: Upload HTML build artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-export
          path: out/
          retention-days: 7

      - name: Comment build status on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Build succeeded!** The site has been compiled to HTML. Download the \`html-export\` artifact from the [workflow run](${runUrl}) to preview locally.`
            })
