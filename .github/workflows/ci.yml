name: CI Build Check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build & Export
        run: npm run build
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: out/
          retention-days: 7
