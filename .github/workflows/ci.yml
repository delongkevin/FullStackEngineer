name: CI - Build Preview

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build HTML Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static HTML export
        run: npm run build

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-preview
          path: out/
          retention-days: 7
