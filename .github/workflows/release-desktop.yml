name: Release Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/release-desktop.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: desktop-artifacts-latest

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/insurance-admin-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/insurance-admin-desktop/dist/PolicyCore-Windows-Setup.exe
          retention-days: 7

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/insurance-admin-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build macOS installer
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/insurance-admin-desktop/dist/PolicyCore-macOS.dmg
          retention-days: 7

  publish-release:
    name: Publish Desktop Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-desktop

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: release-desktop

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          NOTES="## 🖥️ PolicyCore Desktop Downloads

          Native Windows and macOS installers for the Insurance Policy Administration System dashboard.

          | Platform | Installer | Notes |
          |----------|-----------|-------|
          | 🪟 Windows | \`PolicyCore-Windows-Setup.exe\` | Unsigned installer — Windows SmartScreen may warn on first run (More info → Run anyway) |
          | 🍏 macOS | \`PolicyCore-macOS.dmg\` | Unsigned/unnotarized — right-click the app → Open on first launch to bypass Gatekeeper |

          Built automatically from \`desktop/insurance-admin-desktop\` via GitHub Actions."

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — uploading installers..."
            gh release upload "$TAG" release-desktop/*.exe release-desktop/*.dmg --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-desktop/*.exe release-desktop/*.dmg \
              --title "PolicyCore Desktop (Rolling Build)" \
              --notes "$NOTES"
          fi
