name: Release Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/release-desktop.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: desktop-artifacts-latest

jobs:
  build-windows:
    name: Build Windows Installer (${{ matrix.product }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: insurance-admin-desktop
            product: PolicyCore
          - dir: order-system-desktop
            product: ShopQuick
          - dir: task-manager-desktop
            product: TaskFlow
          - dir: avionics-test-desktop
            product: AvionicsTest
          - dir: om-platform-desktop
            product: OMPlatform
          - dir: sit-dashboard-desktop
            product: SITDashboard
          - dir: qa-dashboard-desktop
            product: QADashboard
          - dir: ai-trainer-desktop
            product: AICodeTrainer
          - dir: a11y-qa-trainer-desktop
            product: A11yQATrainer
          - dir: sap-test-manager-desktop
            product: SAPTestManager
          - dir: erp-workbench-desktop
            product: ERPWorkbench
          - dir: wireless-audio-desktop
            product: WirelessAudio
    defaults:
      run:
        working-directory: desktop/${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.product }}
          path: desktop/${{ matrix.dir }}/dist/${{ matrix.product }}-Windows-Setup.exe
          retention-days: 7

  build-macos:
    name: Build macOS Installer (${{ matrix.product }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: insurance-admin-desktop
            product: PolicyCore
          - dir: order-system-desktop
            product: ShopQuick
          - dir: task-manager-desktop
            product: TaskFlow
          - dir: avionics-test-desktop
            product: AvionicsTest
          - dir: om-platform-desktop
            product: OMPlatform
          - dir: sit-dashboard-desktop
            product: SITDashboard
          - dir: qa-dashboard-desktop
            product: QADashboard
          - dir: ai-trainer-desktop
            product: AICodeTrainer
          - dir: a11y-qa-trainer-desktop
            product: A11yQATrainer
          - dir: sap-test-manager-desktop
            product: SAPTestManager
          - dir: erp-workbench-desktop
            product: ERPWorkbench
          - dir: wireless-audio-desktop
            product: WirelessAudio
    defaults:
      run:
        working-directory: desktop/${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build macOS installer
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.product }}
          path: desktop/${{ matrix.dir }}/dist/${{ matrix.product }}-macOS.dmg
          retention-days: 7

  publish-release:
    name: Publish Desktop Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-desktop
          pattern: desktop-*
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          NOTES="## 🖥️ Portfolio Desktop Downloads

          Native Windows and macOS installers for the portfolio's full-stack demo apps, built automatically from \`desktop/*\` via GitHub Actions.

          Each app ships an unsigned Windows installer (SmartScreen may warn on first run — More info → Run anyway) and an unsigned/unnotarized macOS \`.dmg\` (right-click the app → Open on first launch to bypass Gatekeeper)."

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — uploading installers..."
            gh release upload "$TAG" release-desktop/*.exe release-desktop/*.dmg --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-desktop/*.exe release-desktop/*.dmg \
              --title "Portfolio Desktop Apps (Rolling Build)" \
              --notes "$NOTES"
          fi

