name: Book App iOS Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build output target
        required: true
        default: simulator
        type: choice
        options:
          - simulator
          - device-ipa
      configuration:
        description: Xcode build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
      export_method:
        description: IPA export method (used only for device-ipa)
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
      bundle_id:
        description: Bundle identifier for export options (used only for device-ipa)
        required: true
        default: com.yourname.bookstore

env:
  IOS_DIR: ios/book-app
  APP_NAME: BookStore
  SCHEME: BookStore

jobs:
  build-book-app:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen and xcpretty
        run: |
          brew install xcodegen
          gem install xcpretty --no-document

      - name: Generate Xcode project
        run: |
          cd "$IOS_DIR"
          xcodegen generate --spec project.yml

      - name: Validate signing prerequisites for device build
        if: ${{ inputs.build_target == 'device-ipa' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          missing=0
          [ -z "$IOS_P12_BASE64" ] && echo "::error::Missing required secret: IOS_P12_BASE64" && missing=1
          [ -z "$IOS_P12_PASSWORD" ] && echo "::error::Missing required secret: IOS_P12_PASSWORD" && missing=1
          [ -z "$IOS_MOBILEPROVISION_BASE64" ] && echo "::error::Missing required secret: IOS_MOBILEPROVISION_BASE64" && missing=1
          [ -z "$IOS_TEAM_ID" ] && echo "::error::Missing required secret: IOS_TEAM_ID" && missing=1
          [ -z "$IOS_PROFILE_NAME" ] && echo "::error::Missing required secret: IOS_PROFILE_NAME" && missing=1
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set required repository secrets, then re-run this workflow."
            exit 1
          fi

      - name: Build simulator app (unsigned)
        if: ${{ inputs.build_target == 'simulator' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$IOS_DIR/$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration "${{ inputs.configuration }}" \
            -derivedDataPath build/book-app \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcpretty

          APP_PATH=$(find build/book-app -name "$APP_NAME.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Failed to locate $APP_NAME.app in build output"
            exit 1
          fi

          mkdir -p dist
          ditto -c -k --keepParent "$APP_PATH" "dist/${APP_NAME}-${{ inputs.configuration }}-ios-simulator.zip"
          ls -lah dist

      - name: Prepare signing assets for device IPA
        if: ${{ inputs.build_target == 'device-ipa' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          PROFILE_NAME="${{ secrets.IOS_PROFILE_NAME }}"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive iOS app (device)
        if: ${{ inputs.build_target == 'device-ipa' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$IOS_DIR/$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$IOS_DIR/build/$APP_NAME.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive 2>&1 | xcpretty

      - name: Export IPA
        if: ${{ inputs.build_target == 'device-ipa' }}
        run: |
          cat > "$IOS_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.export_method }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ inputs.bundle_id }}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          mkdir -p dist
          xcodebuild \
            -exportArchive \
            -archivePath "$IOS_DIR/build/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$IOS_DIR/ExportOptions.plist" \
            -exportPath dist

          ls -lah dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-app-${{ inputs.build_target }}-${{ inputs.configuration }}
          path: dist/
          retention-days: 7
