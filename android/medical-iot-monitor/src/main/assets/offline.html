<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medical IoT Monitor Offline</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e5e7eb;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(560px, 100%);
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 12px; line-height: 1.5; color: #cbd5e1; }
    .hint { color: #34d399; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Medical IoT Monitor Is Unavailable</h1>
    <p>We could not load the live app right now.</p>
    <p>Please check your internet connection and try again in a moment.</p>
    <p class="hint">Close and reopen the app to retry automatic loading.</p>
  </main>
</body>
</html>
