<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Finance Tracker Demo</title>
  <style>
    :root {
      --bg: #061b14;
      --panel: #0f2b22;
      --panel-2: #14382d;
      --text: #f0fdf4;
      --muted: #b7d7c8;
      --accent: #34d399;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at right top, #134e3d 0, #061b14 60%);
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    .hero { background: var(--panel); border: 1px solid #1f4d3e; border-radius: 16px; padding: 18px; }
    h1 { margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); }
    .balance { margin-top: 10px; font-size: 34px; font-weight: 700; color: var(--accent); }
    .grid { margin-top: 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card { background: var(--panel-2); border: 1px solid #245847; border-radius: 14px; padding: 14px; }
    .bar { height: 8px; background: #275244; border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .chip { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .good { background: #123427; color: #86efac; }
    .warn { background: #3e2f0f; color: var(--warn); }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Personal Finance Tracker</h1>
      <p>Embedded preview of budgeting, categories, and savings analytics.</p>
      <div class="balance">$48,291.50</div>
    </section>
    <section class="grid">
      <article class="card">
        <h3>Budget Usage</h3>
        <p>Monthly spending progress</p>
        <div class="bar"><span style="width:72%"></span></div>
        <span class="chip warn">Warning</span>
      </article>
      <article class="card">
        <h3>Savings Rate</h3>
        <p style="font-size:28px; font-weight:700; color: var(--accent);">21%</p>
        <span class="chip good">Healthy</span>
      </article>
      <article class="card">
        <h3>Top Category</h3>
        <p>Housing · $1,840 this month</p>
      </article>
      <article class="card">
        <h3>Fraud Alerts</h3>
        <p>0 critical alerts in last 30 days</p>
      </article>
    </section>
  </div>
</body>
</html>
