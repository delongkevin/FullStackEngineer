<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Circle Clicker Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .game-container {
            aspect-ratio: 16 / 9;
            width: 100%;
            max-width: 600px;
            margin: auto;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
        }
        .circle {
            background-color: #007bff;
            border-radius: 50%;
            position: absolute;
            touch-action: manipulation;
        }
        /* Fluid Typography */
        h1 {
            font-size: clamp(1.5rem, 2vw + 1rem, 3rem);
            text-align: center;
            margin: 0;
        }
        @media (max-width: 480px) {
            .circle {
                width: 50px;
                height: 50px;
            }
        }
        @media (max-width: 360px) {
            .circle {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Circle Clicker</h1>
        <div class="circle" style="top: 20%; left: 20%;"></div>
        <div class="circle" style="top: 60%; left: 60%;"></div>
    </div>
    <script>
        // Game logic here
    </script>
</body>
</html>
