<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Clicker Game</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #gameArea { position: relative; width: 100%; height: 400px; border: 1px solid #000; overflow: hidden; }
        .circle { position: absolute; border-radius: 50%; background-color: red; }
        #score { font-size: 24px; }
        #level { font-size: 24px; }
        #timer { font-size: 24px; }
    </style>
</head>
<body>
    <h1>Circle Clicker Game</h1>
    <div id="score">Score: 0</div>
    <div id="level">Level: 1</div>
    <div id="timer">Time: 30</div>
    <button id="startButton">Start</button>
    <button id="resetButton" style="display: none;">Reset</button>
    <div id="gameArea"></div>

    <script>
        let score = 0;
        let level = 1;
        let timeLeft = 30;
        let timer;
        let spawnRate = 1000; // milliseconds
        const gameArea = document.getElementById('gameArea');

        document.getElementById('startButton').onclick = startGame;
        document.getElementById('resetButton').onclick = resetGame;

        function startGame() {
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('resetButton').style.display = 'block';
            score = 0;
            level = 1;
            timeLeft = 30;
            spawnRate = 1000;
            document.getElementById('score').innerText = `Score: ${score}`;
            document.getElementById('level').innerText = `Level: ${level}`;
            document.getElementById('timer').innerText = `Time: ${timeLeft}`;
            timer = setInterval(updateTimer, 1000);
            spawnCircle();
        }

        function resetGame() {
            clearInterval(timer);
            startGame();
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('timer').innerText = `Time: ${timeLeft}`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                alert('Game over! Your score: ' + score);
                resetGame();
            }
        }

        function spawnCircle() {
            const circle = document.createElement('div');
            circle.className = 'circle';
            const size = Math.random() * (50 - 20) + 20; // random size between 20 and 50
            circle.style.width = circle.style.height = `${size}px`;
            circle.style.top = `${Math.random() * (gameArea.clientHeight - size)}px`;
            circle.style.left = `${Math.random() * (gameArea.clientWidth - size)}px`;
            circle.onclick = () => {
                score++;
                document.getElementById('score').innerText = `Score: ${score}`;
                gameArea.removeChild(circle);
                checkLevel();
                spawnCircle();
            };
            gameArea.appendChild(circle);

            // Increase spawn rate with level
            setTimeout(() => {
                if (document.body.contains(circle)) {
                    gameArea.removeChild(circle);
                }
            }, spawnRate);
        }

        function checkLevel() {
            if (score > level * 5) {
                level++;
                document.getElementById('level').innerText = `Level: ${level}`;
                spawnRate *= 0.9; // Increase spawn rate (decrease duration)
            }
        }
    </script>
</body>
</html>
