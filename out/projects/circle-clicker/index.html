<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Quick Reflex: Circle Clicker</title><style>* {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;} html, body {width: 100%; height: 100%;} body {display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); padding: 10px; overflow-y: auto; position: fixed; top: 0; left: 0; right: 0; bottom: 0;} .game-container {background-color: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); padding: clamp(15px, 5vw, 30px); width: 100%; max-width: 800px; max-height: 95vh; overflow-y: auto; text-align: center; position: relative;} h1 {color: #333; margin-bottom: 15px; font-size: clamp(1.8rem, 5vw, 2.8rem); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1); background: linear-gradient(to right, #6a11cb, #2575fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;} .game-info {display: flex; justify-content: space-around; flex-wrap: wrap; margin-bottom: 20px; font-size: clamp(0.9rem, 3vw, 1.3rem); font-weight: bold; background: linear-gradient(to right, #f5f7fa, #c3cfe2); padding: clamp(10px, 2vw, 15px); border-radius: 15px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); gap: 10px;} .info-item {display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 80px;} .info-value {font-size: clamp(1.2rem, 4vw, 2rem); color: #6a11cb; margin-top: 5px;} .game-area {width: 100%; aspect-ratio: 1.5 / 1; min-height: 300px; max-height: 500px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 15px; margin: 20px 0; position: relative; overflow: hidden; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1); border: 3px solid #e0e6f0;} .target {position: absolute; border-radius: 50%; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); background: radial-gradient(circle at 30% 30%, #ff9a9e, #fad0c4); display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: clamp(12px, 2vw, 20px); user-select: none; touch-action: none;} .controls {margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;} button {background: linear-gradient(to right, #4CAF50, #45a049); border: none; color: white; padding: clamp(10px, 2vw, 15px) clamp(20px, 5vw, 30px); font-size: clamp(0.9rem, 2.5vw, 1.1rem); cursor: pointer; border-radius: 50px; transition: all 0.3s;} button:hover {transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);} button:active {transform: translateY(0);} .message {font-size: clamp(1rem, 3vw, 1.5rem); margin-top: 15px; font-weight: bold; min-height: 30px;} .success {color: #4CAF50;} .error {color: #f44336;} @media (max-width: 480px) {.game-container {padding: 12px;} .game-area {min-height: 250px; max-height: 400px;} .info-item {min-width: 70px;}} @media (max-width: 360px) {h1 {font-size: 1.5rem;} .game-area {min-height: 200px; max-height: 300px;}}</style></head><body><div class="game-container"><h1>⚡ Quick Reflex</h1><p style="color: #666; margin-bottom: 15px;">Click the circles as fast as you can!</p><div class="game-info"><div class="info-item"><span>Score</span><div class="info-value" id="score">0</div></div><div class="info-item"><span>Time</span><div class="info-value" id="time">30s</div></div><div class="info-item"><span>Misses</span><div class="info-value" id="misses">0</div></div></div><div class="game-area" id="gameArea"></div><div class="controls"><button onclick="startGame()">Start Game</button><button onclick="resetGame()">Reset</button></div><div class="message" id="message"></div></div><script>let score = 0; let misses = 0; let timeLeft = 30; let gameActive = false; let timerInterval; function startGame() {if (gameActive) return; score = 0; misses = 0; timeLeft = 30; gameActive = true; updateDisplay(); showMessage('', ''); spawnTarget(); timerInterval = setInterval(() => {timeLeft--; updateDisplay(); if (timeLeft <= 0) {endGame();}}, 1000);} function spawnTarget() {if (!gameActive) return; const gameArea = document.getElementById('gameArea'); const existingTarget = gameArea.querySelector('.target'); if (existingTarget) existingTarget.remove(); const size = Math.random() * 40 + 30; const maxX = gameArea.clientWidth - size; const maxY = gameArea.clientHeight - size; const target = document.createElement('div'); target.className = 'target'; target.style.width = size + 'px'; target.style.height = size + 'px'; target.style.left = Math.random() * maxX + 'px'; target.style.top = Math.random() * maxY + 'px'; target.textContent = Math.floor(Math.random() * 9) + 1; target.onclick = (e) => {e.stopPropagation(); score++; updateDisplay(); spawnTarget();}; gameArea.appendChild(target);} function updateDisplay() {document.getElementById('score').textContent = score; document.getElementById('time').textContent = timeLeft + 's'; document.getElementById('misses').textContent = misses;} function endGame() {gameActive = false; clearInterval(timerInterval); const gameArea = document.getElementById('gameArea'); gameArea.querySelector('.target')?.remove(); showMessage(`Game Over! Final Score: ${score}`, 'success');} function resetGame() {gameActive = false; clearInterval(timerInterval); score = 0; misses = 0; timeLeft = 30; updateDisplay(); document.getElementById('gameArea').innerHTML = ''; showMessage('Ready to play?', '');} function showMessage(text, className) {const msg = document.getElementById('message'); msg.textContent = text; msg.className = className;} document.getElementById('gameArea').addEventListener('click', function() {if (gameActive) {misses++; updateDisplay(); spawnTarget();}});</script></body></html>
