<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Color Match Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }
        .color-box {
            height: 200px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .color-box:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 480px) {
            body {
                font-size: clamp(14px, 2vw, 16px);
            }
        }
        @media (max-width: 360px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Color boxes will go here -->
        <div class="color-box" style="background-color: #FF5733;"></div>
        <div class="color-box" style="background-color: #33FF57;"></div>
        <div class="color-box" style="background-color: #3357FF;"></div>
        <!-- Add more boxes as needed -->
    </div>
    <script>
        // JavaScript for color comparison logic and improved touch targets
        document.querySelectorAll('.color-box').forEach(box => {
            box.addEventListener('click', function() {
                // Implement color comparison logic here
                console.log(`Box clicked with color: ${this.style.backgroundColor}`);
            });
        });
    </script>
</body>
</html>
